[General]
Enabled=1
DebugLogging=0
DryRun=0
ReflowOnNewWindow=1
AutoRestoreEligibleNewMaximized=1

[WindowSize]
NewWidthRatio=0.65
NewHeightRatio=0.70
MarginPx=16
MinNewWindowShrinkRatio=0.75

[AutoReflow]
AutoMoveExistingWindows=1
AutoResizeExistingWindows=1
MaxMovedExistingWindows=6
AutoMinimumExistingSizeRatio=0.80
AutoMaximumExistingSizeRatio=1.20
MinimumQualityImprovementRatio=0.04
NewWindowDebounceMs=250
MaxPlacementDelayMs=1000
ReflowCooldownMs=750

[ManualReflow]
EnableManualReflow=1
ManualAllowResizeExistingWindows=1
ManualIncludeMaximized=0
MinimumExistingSizeRatio=0.70
MaximumExistingSizeRatio=1.30
ReflowMaxIterations=8

[Placement]
PreferAvoidFocusedWindow=1
CandidateGridSize=5
SolverBudgetMs=350
AllowCrossMonitorMove=0
PreserveZOrder=1
PreserveForeground=1

[Motion]
SmoothMovement=1
SmoothDurationMs=160
SmoothFrameIntervalMs=8
SmoothMaxDurationMs=260

[Scoring]
OverlapWeight=8.0
FocusWeight=5.0
SizeWeight=2.0
AutoMovementWeight=1.2
ManualMovementWeight=0.45
SpacingWeight=0.35
CenterWeight=0.25
TargetCoverage=0.90
CoverageWeight=4.0

[Undo]
Enabled=1
HistoryDepth=1

[Exclusions]
; Comma-separated process names and window classes
ProcessNames=
WindowClasses=

[Hotkeys]
Pause=^!+p
ReflowCurrentMonitor=^!+l
UndoLastLayout=^!+z
ToggleLockActive=^!+k
PlaceActive=^!+o
ReloadConfig=^!+r
EnableDoubleCapsReflow=1
DoubleCapsIntervalMs=500
DoubleCapsRestoreFullscreen=1
